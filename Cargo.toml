[package]
name = "parquet-tui"
version = "26.6.0"
edition = "2024"
description = "A cross-platform terminal viewer for Apache Parquet files"
license = "GPL-3.0"

[dependencies]
ratatui = "0.30"
crossterm = "0.29.0"
duckdb = { version = "1.1", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.8"
arboard = "3"
directories = "5"
chrono = "0.4"

[profile.release]
opt-level = 3

[dev-dependencies]
tempfile = "3"
