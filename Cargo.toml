[package]
name = "pv"
version = "26.8.3"
edition = "2024"
description = "A cross-platform terminal viewer for Apache Parquet files"
license = "GPL-3.0"

[dependencies]
ratatui = "0.30"
crossterm = "0.29.0"
duckdb = { version = "1.10", features = ["bundled"] }
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.98"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
